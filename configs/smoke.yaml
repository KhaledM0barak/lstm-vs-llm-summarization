# Fast end-to-end check that the whole pipeline runs. Not a result-producing run.
run_name: smoke
out_dir: runs/smoke

train_file: data/processed/train.jsonl
val_file: data/processed/validation.jsonl
vocab_file: data/processed/vocab.json

seed: 1234

max_src_len: 400
max_tgt_len: 100

train_size: 256
val_size: 64

emb_dim: 256
hidden_size: 256
enc_layers: 1
dec_layers: 1
bidirectional: true
attention: bahdanau
attn_size: 256
dropout: 0.3
input_feeding: true
tie_embeddings: true

batch_size: 8
lr: 0.001
lr_decay: 0.5
epochs: 1
patience: 2
clip: 5.0
label_smoothing: 0.1
