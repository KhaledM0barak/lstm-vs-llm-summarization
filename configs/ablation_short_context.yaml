# Ablation: truncate the encoder window to 100 source tokens instead of 400.
# Tests how much of the model's score comes from lead bias -- if a 100-token
# window loses little, the model is mostly summarizing the opening paragraphs
# rather than the article.
run_name: short_context
out_dir: runs/short_context

train_file: data/processed/train.jsonl
val_file: data/processed/validation.jsonl
vocab_file: data/processed/vocab.json

seed: 1234

max_src_len: 100         # <- the ablated component
max_tgt_len: 100

emb_dim: 256
hidden_size: 256
enc_layers: 1
dec_layers: 1
bidirectional: true
attention: bahdanau
attn_size: 256
dropout: 0.3
input_feeding: true
tie_embeddings: true

batch_size: 64
lr: 0.001
lr_decay: 0.5
epochs: 5
patience: 2
clip: 5.0
label_smoothing: 0.1
